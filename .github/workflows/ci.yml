name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated content (content/compiled/, public/posts/) is gitignored.
      # oxlint type-aware rules import the compiled module, so it must exist
      # before linting runs.
      - name: Compile content
        run: pnpm compile

      - name: Lint and format check
        run: pnpm check:lint

      - name: Run tests
        run: pnpm test

      - name: Build (runs content compiler via prebuild)
        run: pnpm build

  changeset:
    name: changeset present
    if:
      github.event_name == 'pull_request' && github.head_ref !=
      'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails when files matching changedFilePatterns (.changeset/config.json)
      # changed without a changeset. Internal-only work: pnpm changesets:empty.
      - name: Check for a changeset
        run: pnpm changesets:check
