name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly clean build: no restored caches; wireit defaults to no cache
    # on CI when its caching action is skipped.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  # Per event, so the weekly scheduled run and a push to main never cancel
  # each other (a cancelled push would skip its deploy).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up wireit caching
        if: github.event_name != 'schedule'
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore image store
        if: github.event_name != 'schedule'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.cache/sudo-overclock
          key:
            images-${{ runner.os }}-${{
            hashFiles('src/modules/blog/content/raw/**', 'pnpm-lock.yaml') }}
          restore-keys: images-${{ runner.os }}-

      # Type-aware oxlint needs compiled content; wireit compiles first.
      - name: Lint and format check
        run: pnpm check:lint

      - name: Run tests
        run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      # Canonical host for sitemap / robots / RSS / Open Graph URLs.
      # Mirrors the default in src/app/site.ts (sudo-overclock.space).
      NEXT_PUBLIC_SITE_URL: https://sudo-overclock.space
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up wireit caching
        if: github.event_name != 'schedule'
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore image store
        if: github.event_name != 'schedule'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.cache/sudo-overclock
          key:
            images-${{ runner.os }}-${{
            hashFiles('src/modules/blog/content/raw/**', 'pnpm-lock.yaml') }}
          restore-keys: images-${{ runner.os }}-

      - name: Restore Next.js cache
        if: github.event_name != 'schedule'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key:
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{
            hashFiles('src/**', 'next.config.ts') }}
          restore-keys:
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build (compiles content first)
        run: pnpm build

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  changeset:
    name: changeset present
    if:
      github.event_name == 'pull_request' && github.head_ref !=
      'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails when files matching changedFilePatterns (.changeset/config.json)
      # changed without a changeset. Internal-only work: pnpm changesets:empty.
      - name: Check for a changeset
        run: pnpm changesets:check
