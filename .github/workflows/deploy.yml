name: deploy

# Builds the latest release's code with the posts from main and publishes it
# to GitHub Pages (ADR-012). Called by ci.yml when posts change and by
# release.yml after a release; runnable by hand to redeploy.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build release + current posts
    runs-on: ubuntu-latest
    env:
      # Canonical host for sitemap / robots / RSS / Open Graph URLs.
      NEXT_PUBLIC_SITE_URL: https://sudo-overclock.space
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out the latest release with main's posts
        run: |
          content_sha="$(git rev-parse HEAD)"
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -n "$tag" ]; then
            git checkout -q "$tag"
            rm -rf src/modules/blog/content/raw
            git checkout -q "$content_sha" -- src/modules/blog/content/raw
            version="${tag#v}"
            code="$tag"
          else
            version="$(node -p "require('./package.json').version")"
            code="main (no release yet)"
          fi
          echo "NEXT_PUBLIC_SITE_VERSION=$version" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_CONTENT_SHA=${content_sha:0:7}" >> "$GITHUB_ENV"
          echo "Deploying code from $code with posts from ${content_sha:0:7}." >> "$GITHUB_STEP_SUMMARY"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore image store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.cache/sudo-overclock
          key:
            images-${{ runner.os }}-${{
            hashFiles('src/modules/blog/content/raw/**', 'pnpm-lock.yaml') }}
          restore-keys: images-${{ runner.os }}-

      - name: Build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
